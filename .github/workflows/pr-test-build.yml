name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up mise tools
        uses: jdx/mise-action@v3
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Compile
        run: mise run verify:compile
      - name: Test
        run: mise run verify:test
      - name: Race test
        run: mise run verify:race
      - name: Verify pure-Go plugin loader
        run: mise run verify:purego
      - name: Cross-build for Solaris
        env:
          GOOS: solaris
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -o test-output-solaris ./cmd/server
          rm -f test-output-solaris
