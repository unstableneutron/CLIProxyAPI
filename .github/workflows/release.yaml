name: release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}', inputs.complete_run && 'complete' || 'qualify', inputs.tag) || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact tag from mise release:plan (build only)
        required: true
        type: string
      complete_run:
        description: Qualification run whose pending targets to publish (release:complete only)
        required: false
        type: string
      targets:
        description: Comma-separated pending targets to publish (release:complete only)
        required: false
        type: string
      checksums:
        description: SHA-256 of the locally qualified pending-target manifest (release:complete only)
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-hosted:
    if: github.event_name == 'workflow_dispatch' && !inputs.complete_run
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-amd64, runner: macos-15-intel, goos: darwin, goarch: amd64, asset_arch: amd64, format: tar.gz }
          - { target: darwin-arm64, runner: macos-15, goos: darwin, goarch: arm64, asset_arch: aarch64, format: tar.gz }
          - { target: windows-amd64, runner: windows-latest, goos: windows, goarch: amd64, asset_arch: amd64, format: zip }
          - { target: windows-arm64, runner: windows-11-arm, goos: windows, goarch: arm64, asset_arch: aarch64, format: zip }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
      - name: Build plugin and portable archives
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(git show -s --format=%cI HEAD)"
          ldflags="-s -w -X main.Version=$version -X main.Commit=$commit -X main.BuildDate=$build_date"
          binary=cli-proxy-api; [[ "$GOOS" == windows ]] && binary+=.exe
          for variant in plugin no-plugin; do
            dir="dist/$variant"; mkdir -p "$dir"
            cgo=1; suffix=""; [[ "$variant" == no-plugin ]] && cgo=0 && suffix=_no-plugin
            CGO_ENABLED="$cgo" GOOS="$GOOS" GOARCH="$GOARCH" go build -buildvcs=false -trimpath -ldflags="$ldflags" -o "$dir/$binary" ./cmd/server/
            python3 .agents/buildinfo.py "$dir/$binary"
            cp LICENSE README.md README_CN.md config.example.yaml "$dir/"
            archive="dist/CLIProxyAPI_${version}_${GOOS}_${ASSET_ARCH}${suffix}.${FORMAT}"
            if [[ "$FORMAT" == zip ]]; then
              (cd "$dir" && 7z a -tzip -mx=9 "${GITHUB_WORKSPACE}/$archive" "$binary" LICENSE README.md README_CN.md config.example.yaml BUILDINFO.json)
            else
              tar -C "$dir" -czf "$archive" "$binary" LICENSE README.md README_CN.md config.example.yaml BUILDINFO.json
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
          retention-days: 1

  build-linux:
    if: github.event_name == 'workflow_dispatch' && !inputs.complete_run
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64, runner: ubuntu-latest, goarch: amd64, asset_arch: amd64, image: quay.io/pypa/manylinux2014_x86_64 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, goarch: arm64, asset_arch: aarch64, image: quay.io/pypa/manylinux2014_aarch64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
      - name: Build GLIBC 2.17 plugin and portable archives
        env:
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MANYLINUX_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"; commit="$(git rev-parse --short HEAD)"; build_date="$(git show -s --format=%cI HEAD)"
          ldflags="-s -w -X main.Version=$version -X main.Commit=$commit -X main.BuildDate=$build_date"
          mkdir -p dist/plugin dist/no-plugin
          docker run --rm -v "$PWD:/src" -w /src \
            -e GOARCH \
            -e VERSION="$version" \
            -e COMMIT="$commit" \
            -e BUILD_DATE="$build_date" \
            "$MANYLINUX_IMAGE" bash -euo pipefail -c '
            go_version="$(cat .go-version)"; archive="go${go_version}.linux-${GOARCH}.tar.gz"
            for attempt in 1 2 3 4 5; do
              if curl -fsSL "https://go.dev/dl/${archive}" -o "/tmp/${archive}"; then break; fi
              [[ "$attempt" -lt 5 ]] || exit 1
              sleep "$((attempt * 2))"
            done
            rm -rf /usr/local/go; tar -C /usr/local -xzf "/tmp/${archive}"
            CGO_ENABLED=1 /usr/local/go/bin/go build -buildvcs=false -trimpath -ldflags="-s -w -X main.Version=$VERSION -X main.Commit=$COMMIT -X main.BuildDate=$BUILD_DATE" -o dist/plugin/cli-proxy-api ./cmd/server/
            max="$(readelf --version-info dist/plugin/cli-proxy-api | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -V | tail -1)"
            [[ -z "$max" || "$(printf "2.17\n%s\n" "$max" | sort -V | tail -1)" == 2.17 ]] || { echo "requires GLIBC_$max" >&2; exit 1; }
          '
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -buildvcs=false -trimpath -ldflags="$ldflags" -o dist/no-plugin/cli-proxy-api ./cmd/server/
          for variant in plugin no-plugin; do
            python3 .agents/buildinfo.py "dist/$variant/cli-proxy-api"
            "dist/$variant/cli-proxy-api" -help
            cp LICENSE README.md README_CN.md config.example.yaml "dist/$variant/"
          done
          tar -C dist/plugin -czf "dist/CLIProxyAPI_${version}_linux_${ASSET_ARCH}.tar.gz" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml BUILDINFO.json
          tar -C dist/no-plugin -czf "dist/CLIProxyAPI_${version}_linux_${ASSET_ARCH}_no-plugin.tar.gz" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml BUILDINFO.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
          retention-days: 1

  build-freebsd:
    if: github.event_name == 'workflow_dispatch' && !inputs.complete_run
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: freebsd-amd64, goarch: amd64, asset_arch: amd64, suffix: '', cgo: true }
          - { target: freebsd-arm64-no-plugin, goarch: arm64, asset_arch: aarch64, suffix: _no-plugin, cgo: false }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
      - id: metadata
        run: |
          {
            echo "version=${RELEASE_TAG#v}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "build_date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
      - if: matrix.cgo
        run: sudo apt-get update && sudo apt-get install -y clang lld
      # The cache only avoids refetching; the script re-verifies the pinned
      # checksum on every use, so a stale or poisoned entry cannot be used.
      - if: matrix.cgo
        id: sysroot-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/freebsd-sysroot-cache
          key: freebsd-sysroot-${{ hashFiles('.agents/freebsd-sysroot.sh') }}
      - if: matrix.cgo
        name: Fetch and verify pinned FreeBSD sysroot input
        env:
          FREEBSD_SYSROOT_CACHE: ${{ runner.temp }}/freebsd-sysroot-cache
        run: bash .agents/freebsd-sysroot.sh --check
      - if: matrix.cgo && steps.sysroot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/freebsd-sysroot-cache
          key: ${{ steps.sysroot-cache.outputs.cache-primary-key }}
      - if: matrix.cgo
        name: Build with pinned FreeBSD sysroot
        env:
          FREEBSD_SYSROOT_CACHE: ${{ runner.temp }}/freebsd-sysroot-cache
          VERSION: ${{ steps.metadata.outputs.version }}
          COMMIT: ${{ steps.metadata.outputs.commit }}
          BUILD_DATE: ${{ steps.metadata.outputs.build_date }}
        run: |
          set -euo pipefail
          sysroot=$(mktemp -d)
          trap 'rm -rf "$sysroot"' EXIT
          bash .agents/freebsd-sysroot.sh "$sysroot"
          mkdir -p dist/bin
          CGO_ENABLED=1 GOOS=freebsd GOARCH=amd64 \
            CC="clang --target=x86_64-unknown-freebsd14 --sysroot=$sysroot" CGO_LDFLAGS=-fuse-ld=lld \
            go build -buildvcs=false -trimpath -ldflags="-s -w -X main.Version=$VERSION -X main.Commit=$COMMIT -X main.BuildDate=$BUILD_DATE" -o dist/bin/cli-proxy-api ./cmd/server/
      - if: ${{ !matrix.cgo }}
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/bin
          CGO_ENABLED=0 GOOS=freebsd go build -buildvcs=false -trimpath -ldflags="-s -w -X main.Version=${{ steps.metadata.outputs.version }} -X main.Commit=${{ steps.metadata.outputs.commit }} -X main.BuildDate=${{ steps.metadata.outputs.build_date }}" -o dist/bin/cli-proxy-api ./cmd/server/
      - name: Package archive
        run: |
          mkdir -p dist/archive
          cp dist/bin/cli-proxy-api LICENSE README.md README_CN.md config.example.yaml dist/archive/
          python3 .agents/buildinfo.py dist/archive/cli-proxy-api
          tar -C dist/archive -czf "dist/CLIProxyAPI_${{ steps.metadata.outputs.version }}_freebsd_${{ matrix.asset_arch }}${{ matrix.suffix }}.tar.gz" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml BUILDINFO.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate and publish qualified targets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          message="$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")"
          field() { sed -n "s/^$1: //p" <<<"$message"; }
          run_id="$(field Qualified-Run)"; targets="$(field Qualified-Targets)"; pending="$(field Pending-Targets)"
          qualified_hash="$(field Qualified-Checksums)"
          [[ "$run_id" =~ ^[1-9][0-9]*$ && "$qualified_hash" =~ ^[0-9a-f]{64}$ && -n "$targets" ]]
          # Only the targets bound by the tag are downloaded; failed or pending targets are never published.
          for target in ${targets//,/ }; do gh run download "$run_id" -n "$target" -D dist; done
          QUALIFIED_TARGETS="$targets" python3 -B .agents/release.py --check-run "$run_id" --expected-tag "$GITHUB_REF_NAME" --archives dist > checksums.txt
          [[ "$(sha256sum checksums.txt | cut -d' ' -f1)" == "$qualified_hash" ]]
          mv checksums.txt dist/
          cd dist
          mapfile -t archives < <(cut -d' ' -f3 checksums.txt)

          # The status block is recomputed from checksums.txt whenever pending targets complete.
          status="$(python3 -B ../.agents/release.py --status "$GITHUB_REF_NAME" < checksums.txt)"
          title="$GITHUB_REF_NAME"; [[ "$status" != "Qualification: PARTIAL"* ]] || title+=" (partial)"
          notes="<!-- qualification-status -->"$'\n'"$status"$'\n'"<!-- /qualification-status -->"$'\n\n'"Qualification run: ${run_id}."
          prerelease=false
          release_args=("$GITHUB_REF_NAME" --verify-tag --title "$title" --notes "$notes" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=true
            release_args+=(--prerelease --latest=false)
          fi
          release_args+=("${archives[@]}" checksums.txt)
          gh release create "${release_args[@]}"

          release_json="$(gh api "repos/${GH_REPO}/releases/tags/${GITHUB_REF_NAME}")"
          jq -e \
            --arg tag "$GITHUB_REF_NAME" \
            --argjson prerelease "$prerelease" \
            --argjson asset_count "$((${#archives[@]} + 1))" \
            '.tag_name == $tag and .draft == false and .prerelease == $prerelease and .published_at != null and (.assets | length) == $asset_count' \
            <<<"$release_json" >/dev/null || { echo "release was not published with the expected state and asset count" >&2; exit 1; }
          for asset in "${archives[@]}" checksums.txt; do
            jq -e --arg name "$asset" \
              'any(.assets[]; .name == $name and .state == "uploaded" and .size > 0)' \
              <<<"$release_json" >/dev/null || { echo "published release is missing uploaded asset: $asset" >&2; exit 1; }
          done
          mkdir downloaded
          gh release download "$GITHUB_REF_NAME" --dir downloaded
          for asset in "${archives[@]}" checksums.txt; do cmp "$asset" "downloaded/$asset"; done
          (cd downloaded && sha256sum -c checksums.txt)
          if [[ -n "$pending" ]]; then echo "::warning::Partial release; pending targets: ${pending}"; fi

  complete:
    name: complete pending targets
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.complete_run
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate and publish newly qualified pending targets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.complete_run }}
          TARGETS: ${{ inputs.targets }}
          CHECKSUMS: ${{ inputs.checksums }}
        run: |
          set -euo pipefail
          # Dispatching at the tag ref pins both this workflow and HEAD to the released source.
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]] || { echo "dispatch release:complete at the tag ref" >&2; exit 1; }
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$CHECKSUMS" =~ ^[0-9a-f]{64}$ && -n "$TARGETS" ]]
          pending=",$(git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" | sed -n 's/^Pending-Targets: //p'),"
          for target in ${TARGETS//,/ }; do
            [[ "$pending" == *",$target,"* ]] || { echo "$target is not pending for $RELEASE_TAG" >&2; exit 1; }
            gh run download "$RUN_ID" -n "$target" -D dist
          done
          QUALIFIED_TARGETS="$TARGETS" python3 -B .agents/release.py --check-run "$RUN_ID" --expected-tag "$RELEASE_TAG" --archives dist > new-checksums.txt
          [[ "$(sha256sum new-checksums.txt | cut -d' ' -f1)" == "$CHECKSUMS" ]]
          mapfile -t archives < <(cut -d' ' -f3 new-checksums.txt)
          # Resumable: an archive left by an interrupted attempt must match the qualified bytes.
          published="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for asset in "${archives[@]}"; do
            if grep -qxF "$asset" <<<"$published"; then
              gh release download "$RELEASE_TAG" --pattern "$asset" --dir existing
              cmp "dist/$asset" "existing/$asset"
            else
              gh release upload "$RELEASE_TAG" "dist/$asset"
            fi
          done

          # Rebuild checksums.txt from the published archives, so a retry also recovers an
          # interrupted replacement, then prove it preserves every previously bound checksum.
          gh release download "$RELEASE_TAG" --pattern 'CLIProxyAPI_*' --dir downloaded
          (cd downloaded && sha256sum CLIProxyAPI_* | sort -k2) > checksums.txt
          message="$(git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG")"
          QUALIFIED_TARGETS="$(sed -n 's/^Qualified-Targets: //p' <<<"$message")" python3 -B -c 'import os, sys; sys.path.insert(0, ".agents"); from release import parse_targets, target_archives; [print(name) for target in parse_targets(os.environ["QUALIFIED_TARGETS"]) for name, _ in target_archives(sys.argv[1], target)]' "$RELEASE_TAG" > tag-archives.txt
          [[ "$(awk 'NR == FNR {want[$0]; next} $2 in want' tag-archives.txt checksums.txt | sha256sum | cut -d' ' -f1)" == "$(sed -n 's/^Qualified-Checksums: //p' <<<"$message")" ]]
          while IFS= read -r line; do grep -qxF "$line" checksums.txt; done < new-checksums.txt
          if grep -qxF checksums.txt <<<"$published"; then
            gh release download "$RELEASE_TAG" --pattern checksums.txt --dir previous
            while IFS= read -r line; do grep -qxF "$line" checksums.txt; done < previous/checksums.txt
          fi
          gh release upload "$RELEASE_TAG" checksums.txt --clobber

          status="$(python3 -B .agents/release.py --status "$RELEASE_TAG" < checksums.txt)"
          body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
          history="${body#*<!-- /qualification-status -->}"
          [[ "$history" != "$body" ]] || { echo "release notes lack the qualification status block" >&2; exit 1; }
          title="$RELEASE_TAG"; [[ "$status" != "Qualification: PARTIAL"* ]] || title+=" (partial)"
          notes="<!-- qualification-status -->"$'\n'"$status"$'\n'"<!-- /qualification-status -->${history}"
          notes+=$'\n\n'"Completed targets ${TARGETS} from qualification run ${RUN_ID} (manifest ${CHECKSUMS})."
          gh release edit "$RELEASE_TAG" --title "$title" --notes "$notes"

          gh release download "$RELEASE_TAG" --pattern checksums.txt --dir final
          cmp checksums.txt final/checksums.txt
          for asset in "${archives[@]}"; do cmp "dist/$asset" "downloaded/$asset"; done
          (cd downloaded && sha256sum -c ../checksums.txt)
