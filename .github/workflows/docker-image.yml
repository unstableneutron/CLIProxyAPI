name: docker-image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing image tag to promote to latest
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/unstableneutron/cliproxyapi

jobs:
  build:
    if: ${{ github.event_name == 'push' }}
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux/amd64, scope: amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, scope: arm64 }
    steps:
      - uses: actions/checkout@v6
      - id: metadata
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=docker-${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.scope }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.scope }}
          path: digests/*
          if-no-files-found: error
          # Re-running a failed platform reuses the other platform's digest.
          retention-days: 7

  manifest:
    # A failed platform must not block publishing the platforms that built;
    # the tag is then explicitly partial and is not promoted to latest.
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Create and verify tagged manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          refs=(); platforms=(); missing=()
          for scope in amd64 arm64; do
            files=(digests/digest-"$scope"/*)
            if [[ ${#files[@]} -eq 1 ]]; then
              refs+=("${IMAGE}@sha256:${files[0]##*/}"); platforms+=("linux/$scope")
            else
              missing+=("linux/$scope")
            fi
          done
          [[ ${#refs[@]} -gt 0 ]] || { echo "no platform image was built" >&2; exit 1; }
          # A late re-run must never drop a platform that the tag already serves.
          # Lookup errors other than a missing tag fail closed.
          if existing="$(docker buildx imagetools inspect --raw "${IMAGE}:${GITHUB_REF_NAME}" 2>inspect.err)"; then
            existing_platforms="$(jq -er '[.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"] | join(" ")' <<<"$existing")"
            for platform in $existing_platforms; do
              [[ " ${platforms[*]} " == *" $platform "* ]] || { echo "refusing to drop $platform from ${GITHUB_REF_NAME}" >&2; exit 1; }
            done
          elif ! grep -qi 'not found' inspect.err; then
            cat inspect.err >&2; exit 1
          fi
          docker buildx imagetools create --tag "${IMAGE}:${GITHUB_REF_NAME}" "${refs[@]}"
          result="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}")"
          for platform in "${platforms[@]}"; do grep -q "Platform:.*$platform" <<<"$result"; done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Partial image ${GITHUB_REF_NAME}: published ${platforms[*]}; pending ${missing[*]}"
            echo "Partial image: published ${platforms[*]}; pending ${missing[*]} (re-run failed jobs to complete)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  promote-latest:
    runs-on: ubuntu-latest
    needs: manifest
    if: ${{ always() && ((github.event_name == 'push' && needs.manifest.result == 'success') || github.event_name == 'workflow_dispatch') }}
    concurrency:
      group: docker-latest-promotion
      cancel-in-progress: false
    env:
      SOURCE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Promote release to latest
        run: |
          set -euo pipefail
          # Resolve once and promote the verified immutable digest; partial images never become latest.
          digest="$(docker buildx imagetools inspect "${IMAGE}:${SOURCE_TAG}" --format '{{json .Manifest}}' | jq -er .digest)"
          platforms="$(docker buildx imagetools inspect --raw "${IMAGE}@${digest}" | jq -er '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")')"
          [[ "$platforms" == amd64,arm64 ]] || { echo "refusing to promote partial image ${SOURCE_TAG} ($platforms)" >&2; exit 1; }
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${digest}"
