[tools]
actionlint = "1.7.12"
gh = "2.96.0"
# Build and verification use the patched Go 1.26 point release vetted for publication.
go = "1.26.6"

[tasks.build]
description = "Build the native-plugin server binary"
env = { CGO_ENABLED = "1" }
run = 'go build -o "${OUTPUT:-cli-proxy-api}" ./cmd/server'

[tasks."build:purego"]
description = "Build a CGO-disabled purego host for native plugin smoke tests"
env = { CGO_ENABLED = "0" }
run = 'go build -tags=plugin_purego -o "${OUTPUT:-cli-proxy-api}" ./cmd/server'

[tasks."build:smoke"]
description = "Build a clean Linux smoke-host pair (ARCH, HOST_DIR; CC for cross builds)"
run = '''
set -eu
: "${HOST_DIR:?Set an absolute output directory outside the source tree}"
case "$HOST_DIR" in /*) ;; *) echo 'HOST_DIR must be absolute' >&2; exit 1;; esac
case "${ARCH:-amd64}" in amd64|arm64) ;; *) exit 1;; esac
commit=$(git rev-parse HEAD)
test -z "$(git status --porcelain)"
out="$HOST_DIR/linux_${ARCH:-amd64}"
mkdir -p "$out"
GOOS=linux GOARCH="${ARCH:-amd64}" OUTPUT="$out/cpa-cgo" mise run build
GOOS=linux GOARCH="${ARCH:-amd64}" OUTPUT="$out/cpa-purego" mise run build:purego
test "$(git rev-parse HEAD)" = "$commit"
test -z "$(git status --porcelain)"
'''

[tasks."verify:compile"]
description = "Compile the native-plugin server without retaining an artifact"
env = { CGO_ENABLED = "1" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
output="$(mktemp "${TMPDIR:-/tmp}/cli-proxy-api.XXXXXX")"
trap 'rm -f "$output"' EXIT
go build -o "$output" ./cmd/server
'''

[tasks."verify:test"]
description = "Run the full Go test suite"
env = { CGO_ENABLED = "1" }
run = "go test ./..."

[tasks."verify:race"]
description = "Run the full Go test suite with the race detector"
env = { CGO_ENABLED = "1" }
run = "go test -race ./..."

[tasks."verify:purego"]
description = "Test and compile the pure-Go native plugin loader"
env = { CGO_ENABLED = "0" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
output="$(mktemp "${TMPDIR:-/tmp}/cli-proxy-api-purego.XXXXXX")"
trap 'rm -f "$output"' EXIT
go test -tags=plugin_purego ./...
go build -tags=plugin_purego -o "$output" ./cmd/server
'''

[tasks."verify:check"]
description = "Check formatting, vet, workflow syntax, and whitespace"
run = ['test -z "$(gofmt -l .)"', "go vet ./...", "actionlint", "git diff --check"]

[tasks."verify:matrix"]
description = "Verify portable default and CGO-enabled purego combinations"
run = '''
#!/usr/bin/env bash
set -euo pipefail
output="$(mktemp "${TMPDIR:-/tmp}/cli-proxy-api-matrix.XXXXXX")"
trap 'rm -f "$output"' EXIT
CGO_ENABLED=0 go test ./...
CGO_ENABLED=0 go build -o "$output" ./cmd/server
CGO_ENABLED=1 go test -tags=plugin_purego ./...
CGO_ENABLED=1 go build -tags=plugin_purego -o "$output" ./cmd/server
CGO_ENABLED=1 go test -race -tags=plugin_purego ./internal/pluginhost ./sdk/pluginabi ./sdk/pluginapi
'''

[tasks.verify]
description = "Run source Ship gates (cross-repository artifact smoke is separate)"
run = ["mise run verify:check", "mise run verify:compile", "mise run verify:test", "mise run verify:race", "mise run verify:purego", "mise run verify:matrix"]

[tasks."release:publish"]
description = "Test and atomically push main with an annotated release tag for Actions"
confirm = { message = "Create an annotated tag and atomically push main plus the tag to trigger release workflows?", default = "no" }
usage = 'arg "<tag>" help="Fork prerelease tag (for example, v7.2.94-un.0.1.0)"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

tag="${usage_tag?}"
if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-un\.[0-9]+(\.[0-9]+)*$ ]]; then
  echo "fork release tag must look like v7.2.94-un.0.1.0" >&2
  exit 1
fi
base_tag="${tag%%-un.*}"
if [[ "$(git branch --show-current)" != main ]]; then
  echo "releases must be published from main" >&2
  exit 1
fi
if [[ -n "$(git status --porcelain)" ]]; then
  echo "working tree must be clean before publishing a release" >&2
  exit 1
fi

git fetch upstream --tags
if ! git ls-remote --exit-code --tags upstream "refs/tags/$base_tag" >/dev/null 2>&1; then
  echo "base tag $base_tag does not exist upstream" >&2
  exit 1
fi
git fetch origin main --tags
if ! git merge-base --is-ancestor origin/main HEAD; then
  echo "local main must contain origin/main" >&2
  exit 1
fi
if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
  echo "local tag $tag already exists" >&2
  exit 1
fi
if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
  echo "tag $tag already exists on origin" >&2
  exit 1
fi

source_commit="$(git rev-parse HEAD)"
origin_commit="$(git rev-parse origin/main)"
mise run verify
test "$(git rev-parse HEAD)" = "$source_commit"
test -z "$(git status --porcelain)"
git fetch origin main
test "$(git rev-parse origin/main)" = "$origin_commit"
git tag -a "$tag" -m "Release $tag"
if ! git push --atomic origin HEAD:main "refs/tags/$tag"; then
  git tag -d "$tag"
  exit 1
fi
'''
